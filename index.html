<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090f">
<title>Bobiverse Codex</title>
<style>
:root{
  --bg:#05090f; --bg2:#0a111b; --panel:#0c1622; --panel2:#101d2c;
  --line:#1b3247; --line2:#25465f;
  --cyan:#4fe3ff; --cyan-dim:#2a8fa8; --amber:#ffb547; --red:#ff5d6c; --green:#6dffb0;
  --text:#d6e9f5; --muted:#7f9bb0; --faint:#4b6477;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --c-terms:#4fe3ff; --c-places:#6dffb0; --c-characters:#ffb547; --c-timeline:#c99bff; --c-refs:#ff7ab8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.5;
  background-image:
    linear-gradient(rgba(79,227,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,227,255,.035) 1px, transparent 1px),
    radial-gradient(ellipse at 50% -20%, #0d2236 0%, var(--bg) 60%);
  background-size:32px 32px,32px 32px,100% 100%;
  overflow:hidden;
}
body::after{ /* scanlines */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); height:100dvh; max-width:1400px; margin:0 auto; padding:12px 16px 16px; gap:12px}

/* ---------- header ---------- */
.hdr{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.sigil{width:34px;height:34px;flex:none}
.brand h1{margin:0; font-family:var(--mono); font-size:15px; letter-spacing:.22em; font-weight:600; color:var(--cyan); text-shadow:0 0 12px rgba(79,227,255,.45)}
.brand small{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; color:var(--muted)}
.maplink{margin-left:auto; font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--cyan); text-decoration:none; border:1px solid var(--line2); padding:6px 10px; background:var(--panel)}
.maplink:hover{border-color:var(--cyan); box-shadow:0 0 12px rgba(79,227,255,.25)}
.maplink + .status{margin-left:0}
.status{margin-left:auto; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.1em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.clock{color:var(--cyan-dim)}

/* ---------- control strip ---------- */
.controls{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:stretch}
.search{position:relative}
.search input{
  width:100%; height:42px; padding:0 40px 0 38px; background:var(--panel); border:1px solid var(--line2);
  border-radius:2px; font-family:var(--mono); font-size:14px; letter-spacing:.03em; outline:none;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan), 0 0 18px rgba(79,227,255,.18)}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--cyan-dim)}
.search kbd{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:11px; color:var(--faint); border:1px solid var(--line2); padding:0 6px; border-radius:2px}
.search .clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--muted); cursor:pointer; padding:6px 8px; display:none}
.search.has .clear{display:block}.search.has kbd{display:none}

.bookgate{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line2); padding:0 6px 0 10px; border-radius:2px; height:42px}
.bookgate label{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--amber); white-space:nowrap}
.bookpips{display:flex; gap:3px}
.bookpips button{
  width:30px; height:30px; border:1px solid var(--line2); background:var(--bg2); border-radius:2px; cursor:pointer;
  font-family:var(--mono); font-size:13px; color:var(--muted); transition:.15s;
}
.bookpips button.on{background:rgba(255,181,71,.13); color:var(--amber); border-color:rgba(255,181,71,.5)}
.bookpips button.cur{background:var(--amber); color:#1a1000; border-color:var(--amber); box-shadow:0 0 12px rgba(255,181,71,.5); font-weight:700}
.bookpips button:hover{border-color:var(--amber)}

/* ---------- main ---------- */
.main{display:grid; grid-template-columns:minmax(300px, 420px) minmax(0,1fr); gap:12px; min-height:0}
.frame{position:relative; background:linear-gradient(180deg, rgba(16,29,44,.92), rgba(10,17,27,.92)); border:1px solid var(--line); min-height:0; min-width:0; display:flex; flex-direction:column}
.detailwrap{display:flex; min-height:0; min-width:0}
.detailwrap .frame{flex:1}
.detail{display:block}
.frame::before,.frame::after{content:""; position:absolute; width:14px; height:14px; border:2px solid var(--cyan); pointer-events:none; opacity:.8}
.frame::before{top:-2px; left:-2px; border-right:0; border-bottom:0}
.frame::after{bottom:-2px; right:-2px; border-left:0; border-top:0}

.tabs{display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1px solid var(--line)}
.tab{
  background:none; border:0; border-bottom:2px solid transparent; padding:10px 4px 8px; cursor:pointer;
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.tab b{font-size:16px; font-weight:600; letter-spacing:0; color:var(--faint)}
.tab.on{color:var(--tc); border-bottom-color:var(--tc); background:linear-gradient(0deg, color-mix(in srgb, var(--tc) 10%, transparent), transparent)}
.tab.on b{color:var(--tc)}
.tab:hover{color:var(--text)}

.chips{display:flex; gap:6px; padding:10px 12px; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none; flex:none}
.chips::-webkit-scrollbar{display:none}
.chipsep{flex:none; width:1px; margin:2px 4px; background:var(--line)}
.chip{flex:none; background:var(--bg2); border:1px solid var(--line2); border-radius:20px; padding:3px 10px; font-size:12px; font-family:var(--mono); color:var(--muted); cursor:pointer; white-space:nowrap}
.chip.on{color:var(--bg); background:var(--tc); border-color:var(--tc)}

.list{overflow-y:auto; flex:1; min-height:0; padding:6px 0; scrollbar-width:thin; scrollbar-color:var(--line2) transparent}
.row{
  display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; width:100%; text-align:left;
  background:none; border:0; border-left:2px solid transparent; padding:9px 14px 9px 12px; cursor:pointer;
}
.row:hover{background:rgba(79,227,255,.05)}
.row.sel{background:color-mix(in srgb, var(--tc) 11%, transparent); border-left-color:var(--tc)}
.row .glyph{width:8px; height:8px; transform:rotate(45deg); border:1.5px solid var(--tc); opacity:.8}
.row.sel .glyph{background:var(--tc)}
.row > span:nth-child(2){min-width:0}
.row .nm{display:block; font-weight:550; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .sub{display:block; font-size:12px; color:var(--muted); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .bk{font-family:var(--mono); font-size:11px; color:var(--faint); border:1px solid var(--line); padding:0 5px; border-radius:2px}
.row .type{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--tc); text-transform:uppercase}
mark{background:rgba(255,181,71,.25); color:var(--amber); border-radius:2px; padding:0 1px}

.grouphdr{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:var(--faint); padding:12px 14px 4px; text-transform:uppercase; display:flex; gap:8px; align-items:center}
.grouphdr::after{content:""; flex:1; height:1px; background:var(--line)}

/* timeline list */
.tl{position:relative; padding:4px 0 10px}
.tl-book{padding:14px 14px 6px 44px; position:relative}
.tl-book h3{margin:0; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--c-timeline); text-transform:uppercase}
.tl-book p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
.tl-book::before{content:attr(data-n); position:absolute; left:12px; top:13px; width:22px; height:22px; border:1px solid var(--c-timeline); color:var(--c-timeline); font-family:var(--mono); font-size:12px; display:grid; place-items:center; background:var(--bg2)}
.tl .row{grid-template-columns:auto 1fr auto; padding-left:20px; position:relative}
.tl .row::before{content:""; position:absolute; left:22px; top:0; bottom:0; width:1px; background:var(--line2)}
.tl .row .glyph{position:relative; z-index:1; background:var(--bg2)}
.tl .row.sel .glyph{background:var(--tc)}
.tl-note{font-size:12px; opacity:.7; margin:2px 0 10px 12px}
.when{font-family:var(--mono); font-size:11px; color:var(--c-timeline); opacity:.85}

.empty{padding:28px 18px; color:var(--muted); font-family:var(--mono); font-size:13px; text-align:center}
.lockednote{margin:8px 12px 12px; padding:9px 12px; border:1px dashed rgba(255,181,71,.35); color:var(--amber); font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; opacity:.85}

/* ---------- detail ---------- */
.detail{overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line2) transparent}
.dhead{padding:22px 26px 16px; border-bottom:1px solid var(--line); position:relative}
.back{display:none; background:none; border:1px solid var(--line2); color:var(--cyan); font-family:var(--mono); font-size:12px; letter-spacing:.1em; padding:6px 10px; cursor:pointer; margin-bottom:14px; border-radius:2px}
.kicker{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--tc); display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.kicker span+span::before{content:"//"; margin-right:10px; color:var(--faint)}
.dhead h2{margin:8px 0 4px; font-size:clamp(24px, 3.4vw, 34px); line-height:1.15; font-weight:650; letter-spacing:-.01em}
.aka{font-size:13px; color:var(--muted)}
.aka b{font-family:var(--mono); font-weight:400; font-size:11px; letter-spacing:.12em; color:var(--faint); margin-right:6px}
.meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.tag{font-family:var(--mono); font-size:11.5px; padding:3px 9px; border:1px solid var(--line2); border-radius:2px; color:var(--muted); background:var(--bg2)}
.tag.book{color:var(--amber); border-color:rgba(255,181,71,.4)}
.tag.maptag{color:var(--cyan); border-color:rgba(79,227,255,.4); text-decoration:none}
.tag.maptag:hover{border-color:var(--cyan)}
.tag.conf-medium{color:var(--amber); border-style:dashed}
.tag.conf-low{color:var(--red); border-color:rgba(255,93,108,.5); border-style:dashed}
.tag.conf-high{color:var(--green); border-color:rgba(109,255,176,.35)}
.tag button{all:unset; cursor:pointer; text-decoration:underline; text-underline-offset:2px}

.dbody{padding:18px 26px 28px; display:grid; grid-template-columns:minmax(0,1fr); gap:22px}
.sect h4{margin:0 0 8px; font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; color:var(--cyan-dim); font-weight:500; text-transform:uppercase; display:flex; align-items:center; gap:8px}
.sect h4::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--line2), transparent)}
.summary{font-size:17px; line-height:1.6; margin:0; max-width:62ch}
.confnote{margin-top:10px; font-size:12.5px; color:var(--muted); max-width:62ch}
.updates{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.updates li{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:baseline; max-width:66ch}
.updates .ub{font-family:var(--mono); font-size:11px; color:var(--amber); border:1px solid rgba(255,181,71,.4); padding:1px 6px; white-space:nowrap}
.links{display:flex; flex-wrap:wrap; gap:8px}
.link{
  display:inline-flex; align-items:center; gap:8px; background:var(--bg2); border:1px solid var(--line2); border-left:3px solid var(--tc);
  padding:6px 12px 6px 9px; cursor:pointer; font-size:13.5px; border-radius:2px; text-align:left; transition:.12s;
}
.link:hover{border-color:var(--tc); background:color-mix(in srgb, var(--tc) 10%, var(--bg2))}
.link small{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--tc); text-transform:uppercase}
.events{display:grid; gap:6px}
.event{display:grid; grid-template-columns:52px 1fr; gap:12px; align-items:baseline; background:none; border:0; border-left:1px solid var(--line2); padding:4px 0 4px 12px; text-align:left; cursor:pointer}
.event:hover{border-left-color:var(--c-timeline)}
.event .when{font-size:11px}
.event span:last-child{font-size:14px}
.event em{font-style:normal; color:var(--muted); font-size:12px}

.idle{height:100%; display:grid; place-items:center; text-align:center; padding:30px}
.idle .ring{width:120px; height:120px; margin:0 auto 18px}
.idle p{font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted); margin:4px 0}
.idle .hint{color:var(--faint); font-size:11px}
.locked{padding:40px 26px; text-align:center}
.locked h2{font-family:var(--mono); color:var(--amber); font-size:16px; letter-spacing:.2em}
.locked p{color:var(--muted)}
.btn{background:rgba(255,181,71,.1); border:1px solid var(--amber); color:var(--amber); padding:8px 14px; font-family:var(--mono); font-size:12px; letter-spacing:.1em; cursor:pointer; border-radius:2px}

.foot{font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.08em; padding:8px 14px; border-top:1px solid var(--line); flex:none; display:flex; justify-content:space-between; gap:10px}

/* ---------- responsive ---------- */
@media (max-width: 820px){
  body{font-size:15px}
  .app{padding:10px 12px 12px; gap:10px; padding-bottom:max(12px, env(safe-area-inset-bottom))}
  .status .clock{display:none}
  .controls{grid-template-columns:minmax(0,1fr)}
  .bookgate{justify-content:space-between}
  .bookpips button{width:34px; height:30px}
  .main{grid-template-columns:minmax(0,1fr); position:relative}
  .bookgate label{font-size:10px; letter-spacing:.1em}
  .bookgate label span{display:none}
  body:not(.showdetail) .detailwrap{visibility:hidden}
  .detailwrap{position:fixed; inset:0; width:100%; z-index:20; background:var(--bg); transform:translateX(102%); transition:transform .22s ease; padding:10px 12px max(12px, env(safe-area-inset-bottom)); display:flex}
  .detailwrap .frame{flex:1}
  body.showdetail .detailwrap{transform:none}
  .back{display:inline-block}
  .dhead{padding:16px 18px 14px}
  .dbody{padding:16px 18px 26px}
  .summary{font-size:16px}
  .search kbd{display:none}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>

n message in Clarke's novel and its film: \"All these worlds are yours, except Europa.\"","related":["bobiverse"],"confidence":"high"},{"id":"ref-caerleon","name":"Caerleon","work":"Arthurian legend","medium":"Myth & legend","firstBook":3,"summary":"The rival Deltan village gets the name of another of King Arthur's seats, to match Camelot.","related":["caerleon","camelot","fred"],"confidence":"high"},{"id":"ref-norse-gods","name":"Odin and Thor","work":"Norse mythology","medium":"Myth & legend","firstBook":3,"summary":"More Norse names turn up: the gas giant Odin, and a Bob called Thor.","related":["odin","thor"],"confidence":"medium"},{"id":"ref-greek","name":"Daedalus, Icarus, Bellerophon, Poseidon","work":"Greek mythology","medium":"Myth & legend","firstBook":3,"summary":"A cluster of Greek names: the inventor Daedalus and his son Icarus, the hero Bellerophon, and the sea god Poseidon.","related":["daedalus","icarus","bellerophon","poseidon"],"confidence":"high"},{"id":"ref-starfleet","name":"Starfleet","work":"Star Trek","medium":"TV","firstBook":4,"summary":"The faction that insists on non-interference names itself after Star Trek's Starfleet and its Prime Directive.","related":["starfleet"],"confidence":"high"},{"id":"ref-bender","name":"Bender","work":"Futurama","medium":"TV","firstBook":4,"summary":"The missing clone shares his name with Futurama's foul-mouthed robot.","related":["bender"],"confidence":"medium"},{"id":"ref-hugh","name":"Hugh","work":"Star Trek: The Next Generation","medium":"TV","firstBook":4,"summary":"Shares a name with Hugh, the Borg drone who gains individuality in The Next Generation, a fitting name for a Bob who works with AIs.","related":["hugh","skippies"],"confidence":"medium"},{"id":"ref-boojums","name":"Boojums","work":"The Hunting of the Snark (Lewis Carroll)","medium":"Literature","firstBook":4,"summary":"In Carroll's poem a Boojum is the deadly kind of Snark that makes hunters vanish, like the scouts that disappear at Eta Lepor <script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const KINDS = {
  terms:      {label:'Terms',      one:'Term',      color:'var(--c-terms)',      facet:'category'},
  places:     {label:'Places',     one:'Place',     color:'var(--c-places)',     facet:'kind'},
  characters: {label:'Characters', one:'Character', color:'var(--c-characters)', facet:'group'},
  timeline:   {label:'Timeline',   one:'Event',     color:'var(--c-timeline)',   facet:null},
  references: {label:'Refs',       one:'Reference', color:'var(--c-refs)',       facet:'medium'},
};
const BOOKS = Object.fromEntries(D.books.map(b => [b.id, b]));
const MAXB = Math.max(...D.books.map(b => b.id));
const INDEX = {};
for (const k of Object.keys(KINDS)) for (const e of D[k]) { e._k = k; e._b = e.firstBook ?? e.book; INDEX[e.id] = e; }
const nameOf = e => e.name || e.title;

const store = {
  get(k, d){ try { const v = localStorage.getItem('bobcodex.'+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('bobcodex.'+k, JSON.stringify(v)); } catch {} }
};
const S = { book: store.get('book', MAXB), tab: store.get('tab', 'terms'), facet: null, rbook: null, q: '', sel: null };
if (!KINDS[S.tab]) S.tab = 'terms';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visible = e => e && e._b <= S.book;
const bookShort = n => `B${n}`;

// ---------- book gate ----------
function renderPips(){
  $('#pips').innerHTML = D.books.map(b =>
    `<button role="radio" aria-checked="${b.id===S.book}" class="${b.id<S.book?'on':''} ${b.id===S.book?'cur':''}" data-b="${b.id}" title="Book ${b.id}: ${esc(b.title)} (${b.year})">${b.id}</button>`).join('');
  const b = BOOKS[S.book];
  $('#gateinfo').textContent = `GATE: ${b.title.toUpperCase()}`;
}
$('#pips').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  S.book = +b.dataset.b; store.set('book', S.book);
  renderAll();
});

// ---------- search ----------
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function haystack(e){
  const parts = [nameOf(e), ...(e.aliases||[]), e.summary, e.category, e.kind, e.group, e.when, e.work, e.medium];
  for (const u of (e.updates||[])) if (u.book <= S.book) parts.push(u.text);
  return norm(parts.join(' \u0001 '));
}
function matches(e, q){
  if (!q) return true;
  const h = haystack(e);
  return norm(q).split(/\s+/).filter(Boolean).every(t => h.includes(t));
}
function score(e, q){
  if (!q) return 0;
  const n = norm(nameOf(e)), t = norm(q);
  if (n === t) return 0; if (n.startsWith(t)) return 1;
  if ((e.aliases||[]).some(a => norm(a).includes(t)) || n.includes(t)) return 2;
  return 3;
}
function hl(text, q){
  const s = esc(text); if (!q) return s;
  const terms = norm(q).split(/\s+/).filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if (!terms.length) return s;
  return s.replace(new RegExp(`(${terms.join('|')})`, 'gi'), '<mark>$1</mark>');
}

// ---------- tabs / list ----------
function itemsFor(k){ return D[k].filter(visible).filter(e => matches(e, S.q)); }
function renderTabs(){
  $('#tabs').innerHTML = Object.entries(KINDS).map(([k, m]) =>
    `<button class="tab ${k===S.tab?'on':''}" role="tab" aria-selected="${k===S.tab}" data-k="${k}" style="--tc:${m.color}">${m.label}<b>${itemsFor(k).length}</b></button>`).join('');
}
$('#tabs').addEventListener('click', ev => {
  const t = ev.target.closest('.tab'); if (!t) return;
  S.tab = t.dataset.k; S.facet = null; store.set('tab', S.tab);
  renderTabs(); renderChips(); renderList(); $('#list').scrollTop = 0;
});

function renderChips(){
  const m = KINDS[S.tab], el = $('#chips');
  el.style.setProperty('--tc', m.color);
  if (!m.facet){ // timeline: jump to book
    el.innerHTML = `<button class="chip ${S.facet==null?'on':''}" data-f="">All books</button>` +
      D.books.filter(b => b.id <= S.book).map(b => `<button class="chip ${S.facet==b.id?'on':''}" data-f="${b.id}">Book ${b.id}</button>`).join('');
    return;
  }
  const counts = {};
  for (const e of itemsFor(S.tab)) counts[e[m.facet]] = (counts[e[m.facet]]||0) + 1;
  const keys = Object.keys(counts).sort((a,b) => counts[b]-counts[a] || a.localeCompare(b));
  if (S.facet && !counts[S.facet]) S.facet = null;
  el.innerHTML = `<button class="chip ${S.facet==null?'on':''}" data-f="">All</button>` +
    keys.map(f => `<button class="chip ${S.facet===f?'on':''}" data-f="${esc(f)}">${esc(f)} · ${counts[f]}</button>`).join('');
  if (S.tab === 'references'){
    if (S.rbook && S.rbook > S.book) S.rbook = null;
    el.innerHTML += `<span class="chipsep"></span><button class="chip ${S.rbook==null?'on':''}" data-rb="">All books</button>` +
      D.books.filter(b => b.id <= S.book).map(b => `<button class="chip ${S.rbook===b.id?'on':''}" data-rb="${b.id}">Book ${b.id}</button>`).join('');
  }
}
$('#chips').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (!c) return;
  if (c.dataset.rb !== undefined){ S.rbook = c.dataset.rb === '' ? null : +c.dataset.rb; renderChips(); renderList(); $('#list').scrollTop = 0; return; }
  const f = c.dataset.f; S.facet = f === '' ? null : (KINDS[S.tab].facet ? f : +f);
  renderChips(); renderList(); $('#list').scrollTop = 0;
});

function rowHTML(e){
  const m = KINDS[e._k];
  const sub = e._k === 'references' ? `${e.work} · ${e.summary}` : e.summary;
  const right = e._k === 'timeline' ? `<span class="when"${(e.when||'').startsWith('~') ? ' title="Estimate"' : ''}>${esc(e.when || '—')}</span>` : `<span class="bk" title="${esc(BOOKS[e._b].title)}">${bookShort(e._b)}</span>`;
  return `<button class="row ${S.sel===e.id?'sel':''}" data-id="${esc(e.id)}" style="--tc:${m.color}">
    <span class="glyph"></span>
    <span><span class="nm">${hl(nameOf(e), S.q)}</span><span class="sub">${hl(sub, S.q)}</span></span>
    ${right}</button>`;
}

function renderList(){
  const k = S.tab, m = KINDS[k], el = $('#list');
  let items = itemsFor(k);
  if (m.facet && S.facet) items = items.filter(e => e[m.facet] === S.facet);
  if (!m.facet && S.facet) items = items.filter(e => e.book === S.facet);
  if (k === 'references' && S.rbook) items = items.filter(e => e._b === S.rbook);
  let html = '';
  if (k === 'timeline'){
    items.sort((a,b) => a.book-b.book || a.order-b.order);
    html = '<div class="tl"><p class="tl-note">Years are in-story dates. <span class="when">~</span> marks an estimate.</p>';
    let cur = null;
    for (const e of items){
      if (e.book !== cur){ cur = e.book; const b = BOOKS[cur];
        html += `<div class="tl-book" data-n="${cur}"><h3>${esc(b.title)} · <span title="Publication year">pub. ${b.year}</span></h3><p>${esc(b.summary)}</p></div>`; }
      html += rowHTML(e);
    }
    html += '</div>';
  } else {
    items.sort((a,b) => score(a,S.q)-score(b,S.q) || a._b-b._b || nameOf(a).localeCompare(nameOf(b)));
    if (S.q) html = items.map(rowHTML).join('');
    else {
      let cur = null;
      for (const e of items){
        if (e._b !== cur){ cur = e._b; html += `<div class="grouphdr">Book ${cur} · ${esc(BOOKS[cur].title)}</div>`; }
        html += rowHTML(e);
      }
    }
  }
  if (!items.length){
    const otherHits = S.q ? Object.keys(KINDS).filter(o => o !== k && itemsFor(o).length) : [];
    html = `<div class="empty">NO SIGNAL.<br>${S.q ? `Nothing in ${m.label.toLowerCase()} matches “${esc(S.q)}”.` : 'Nothing here yet at this book.'}` +
      (otherHits.length ? `<br><br>Matches in: ${otherHits.map(o => `<button class="chip" data-jump="${o}" style="--tc:${KINDS[o].color}">${KINDS[o].label} · ${itemsFor(o).length}</button>`).join(' ')}` : '') + `</div>`;
  }
  const hidden = D[k].filter(e => !visible(e)).length;
  if (hidden) html += `<div class="lockednote">▣ ${hidden} ${hidden===1?'entry':'entries'} sealed beyond Book ${S.book}. Raise the gate to reveal.</div>`;
  el.innerHTML = html;
  $('#count').textContent = `${items.length} ${items.length===1?'RECORD':'RECORDS'}`;
}
$('#list').addEventListener('click', ev => {
  const j = ev.target.closest('[data-jump]');
  if (j){ S.tab = j.dataset.jump; S.facet = null; renderTabs(); renderChips(); renderList(); return; }
  const r = ev.target.closest('.row'); if (r) go(r.dataset.id);
});

// ---------- detail ----------
const CONF_REF = {
  high:   'The book makes this explicit, or the reference is unmistakable.',
  medium: 'The name clearly points here, but the book may not spell it out.',
  low:    "A fan reading that the books don't confirm. Take it with a grain of salt.",
};
const CONF = {
  high:   'Sources agree.',
  medium: 'Sources disagree on a detail, or the first-appearance book is a best guess (the later plausible book was used, to be safe).',
  low:    'Based only on pre-release information about Book 6. Treat as provisional.',
};
function idle(){
  return `<div class="idle"><div>
    <svg class="ring" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <circle cx="60" cy="60" r="56" stroke="#1b3247"/>
      <circle cx="60" cy="60" r="44" stroke="#25465f" stroke-dasharray="2 6"/>
      <circle cx="60" cy="60" r="30" stroke="#4fe3ff" stroke-opacity=".5">
        <animate attributeName="r" values="22;40;22" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0;.6" dur="4s" repeatCount="indefinite"/>
      </circle>
      <path d="M60 4v14M60 102v14M4 60h14M102 60h14" stroke="#2a8fa8"/>
      <circle cx="60" cy="60" r="5" fill="#ffb547"/>
    </svg>
    <p>AWAITING SELECTION</p>
    <p class="hint">Pick a record from the archive. Press / to search.</p>
  </div></div>`;
}
function linkHTML(e){
  const m = KINDS[e._k];
  return `<button class="link" data-id="${esc(e.id)}" style="--tc:${m.color}"><small>${m.one}</small>${esc(e._k==='references' ? e.work : nameOf(e))}</button>`;
}
function renderDetail(){
  const el = $('#detail'), e = INDEX[S.sel];
  if (!e){ el.innerHTML = idle(); el.style.removeProperty('--tc'); return; }
  const m = KINDS[e._k];
  el.style.setProperty('--tc', m.color);
  const back = `<button class="back" data-back>‹ BACK</button>`;
  if (!visible(e)){
    el.innerHTML = `<div class="dhead">${back}</div><div class="locked"><h2>▣ SEALED RECORD</h2>
      <p>This record first appears after the book you're reading (Book ${S.book}).</p>
      <button class="btn" data-unlock="${e._b}">Raise gate to Book ${e._b}</button></div>`;
    return;
  }
  const kick = [m.one, e.category || e.kind || e.group || e.medium, e._k==='timeline' && e.when ? e.when : null].filter(Boolean);
  const conf = (e._k === 'references' ? CONF_REF : CONF)[e.confidence];
  const parent = e.parent && INDEX[e.parent] && visible(INDEX[e.parent]) ? INDEX[e.parent] : null;
  const children = e._k === 'places' ? D.places.filter(p => p.parent === e.id && visible(p)) : [];
  const ups = (e.updates||[]).filter(u => u.book <= S.book).sort((a,b) => a.book-b.book);
  const rel = (e.related||[]).map(id => INDEX[id]).filter(visible);
  // reverse links: other entries that point here
  const back2 = Object.values(INDEX).filter(o => o !== e && o._k !== 'timeline' && visible(o) && (o.related||[]).includes(e.id) && !rel.includes(o));
  const events = e._k === 'timeline' ? [] : D.timeline.filter(t => visible(t) && t.related.includes(e.id)).sort((a,b) => a.book-b.book || a.order-b.order);
  const groups = {};
  for (const r of [...rel, ...back2].filter(r => r._k !== 'timeline' && !children.includes(r) && r !== parent)) (groups[r._k] ||= []).push(r);
  const relEvents = rel.filter(r => r._k === 'timeline');

  el.innerHTML = `
  <div class="dhead">${back}
    <div class="kicker">${kick.map(k => `<span>${esc(k)}</span>`).join('')}</div>
    <h2>${esc(nameOf(e))}</h2>
    ${e.aliases && e.aliases.length ? `<div class="aka"><b>AKA</b>${e.aliases.map(esc).join(' · ')}</div>` : ''}
    <div class="meta">
      <span class="tag book">${e._k==='timeline'?'Happens in':'First seen'}: Book ${e._b} · ${esc(BOOKS[e._b].title)}</span>
      <span class="tag conf-${e.confidence}" title="${esc(conf)}">Confidence: ${esc(e.confidence)}</span>
      ${e._k !== 'timeline' ? `<a class="tag maptag" href="map.html#${encodeURIComponent(e.id)}">◈ Show on map</a>` : ''}
      ${parent ? `<span class="tag">In <button data-id="${esc(parent.id)}">${esc(parent.name)}</button></span>` : ''}
    </div>
  </div>
  <div class="dbody">
    ${e.work ? `<div class="sect"><h4>Refers to</h4><p class="summary"><b>${esc(e.work)}</b> · ${esc(e.medium)}</p></div>` : ''}
    <div class="sect"><h4>${e._k==='references'?'The reference':'Summary'}</h4><p class="summary">${esc(e.summary)}</p>
      ${e.confidence !== 'high' ? `<div class="confnote">⚠ ${esc(conf)}</div>` : ''}</div>
    ${ups.length ? `<div class="sect"><h4>Later developments</h4><ul class="updates">${ups.map(u => `<li><span class="ub">Book ${u.book}</span><span>${esc(u.text)}</span></li>`).join('')}</ul></div>` : ''}
    ${children.length ? `<div class="sect"><h4>Contains</h4><div class="links">${children.map(linkHTML).join('')}</div></div>` : ''}
    ${['characters','places','terms','references'].filter(k => groups[k]).map(k => `<div class="sect"><h4>Linked ${KINDS[k].label.toLowerCase()}</h4><div class="links">${groups[k].map(linkHTML).join('')}</div></div>`).join('')}
    ${[...events, ...relEvents].length ? `<div class="sect"><h4>On the timeline</h4><div class="events">${[...events, ...relEvents].map(t => `<button class="event" data-id="${esc(t.id)}"><span class="when">B${t.book}${t.when ? `<br>${esc(t.when)}`:''}</span><span>${esc(t.title)} <em>· ${esc(t.summary)}</em></span></button>`).join('')}</div></div>` : ''}
  </div>`;
  el.scrollTop = 0;
}
$('#detail').addEventListener('click', ev => {
  if (ev.target.closest('[data-back]')){ closeDetail(); return; }
  const u = ev.target.closest('[data-unlock]');
  if (u){ S.book = +u.dataset.unlock; store.set('book', S.book); renderAll(); return; }
  const l = ev.target.closest('[data-id]'); if (l) go(l.dataset.id);
});

// ---------- routing ----------
function go(id){ if (location.hash.slice(1) !== id) location.hash = id; else route(); }
function closeDetail(){
  if (history.length > 1 && location.hash) history.back(); else { location.hash = ''; }
}
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const e = INDEX[id];
  S.sel = e ? id : null;
  document.body.classList.toggle('showdetail', !!e);
  if (e && e._k !== S.tab && !S.q){ S.tab = e._k; S.facet = null; store.set('tab', S.tab); renderTabs(); renderChips(); }
  renderList(); renderDetail();
  const r = document.querySelector(`.row[data-id="${CSS.escape(S.sel||'')}"]`);
  if (r && window.matchMedia('(min-width: 821px)').matches) r.scrollIntoView({block:'nearest'});
}
window.addEventListener('hashchange', route);

// ---------- search wiring ----------
let t;
$('#q').addEventListener('input', ev => {
  clearTimeout(t);
  t = setTimeout(() => {
    S.q = ev.target.value.trim();
    $('#searchbox').classList.toggle('has', !!S.q);
    renderTabs(); renderChips(); renderList();
    // if current tab has nothing but others do, hop to the best one
    if (S.q && !itemsFor(S.tab).length){
      const best = Object.keys(KINDS).find(k => itemsFor(k).length);
      if (best){ S.tab = best; S.facet = null; renderTabs(); renderChips(); renderList(); }
    }
  }, 80);
});
$('#clearq').addEventListener('click', () => { $('#q').value=''; $('#q').dispatchEvent(new Event('input')); $('#q').focus(); });
document.addEventListener('keydown', ev => {
  if (ev.key === '/' && document.activeElement !== $('#q')){ ev.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (ev.key === 'Escape'){
    if (document.activeElement === $('#q') && $('#q').value){ $('#clearq').click(); }
    else if (S.sel) closeDetail();
  }
  else if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && document.activeElement && (document.activeElement.classList.contains('row') || document.activeElement === $('#q'))){
    const rows = [...document.querySelectorAll('#list .row')]; if (!rows.length) return;
    ev.preventDefault();
    const i = rows.indexOf(document.activeElement);
    const n = ev.key === 'ArrowDown' ? Math.min(rows.length-1, i+1) : Math.max(0, i-1);
    rows[n].focus(); rows[n].scrollIntoView({block:'nearest'});
  }
});

// ---------- clock ----------
function tick(){ const d = new Date(); $('#clock').textContent = d.toISOString().slice(0,19).replace('T',' ') + 'Z'; }
setInterval(tick, 1000); tick();

function renderAll(){ renderPips(); renderTabs(); renderChips(); route(); }
renderAll();
})();
</script>
